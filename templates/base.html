{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deskline — Requester Ticket Inbox{% endblock %}</title>
  <meta name="description" content="Deskline is a self-hostable helpdesk for small support teams: a shared ticket queue with priority, macros and SLA countdowns.">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}" data-sla-due-soon-hours="{{ sla_due_soon_hours }}">
  <div class="scroll-thread" aria-hidden="true"><span class="scroll-thread__fill"></span></div>
  {% block content %}{% endblock %}
  <script src="{% static 'js/app.js' %}" defer></script>
  <script src="{% static 'js/sla-tick.js' %}" defer></script>
</body>
</html>
